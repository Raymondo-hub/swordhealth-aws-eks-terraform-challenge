name: Production EKS Terraform
on:
  pull_request:
    paths: ['terraform/**', '.github/workflows/terraform-prod.yml']
  push:
    branches: [main]
    paths: ['terraform/**', '.github/workflows/terraform-prod.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: terraform-prod-eks
  cancel-in-progress: false
jobs:
  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: terraform/environments } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format
        run: terraform fmt -check -recursive ../../
      - name: Assume AWS plan role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="key=prod/eks/terraform.tfstate"
      - name: Validate
        run: terraform validate
      - name: Plan
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_platform_admin_role_arn: ${{ vars.EKS_ADMIN_ROLE_ARN }}
        run: terraform plan -input=false -lock-timeout=5m -no-color -out=prod.tfplan
      - name: Save reviewed plan for apply
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: prod-terraform-plan-${{ github.run_id }}
          path: terraform/environments/prod.tfplan
          retention-days: 1
  apply:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    defaults: { run: { working-directory: terraform/environments } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Download reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: prod-terraform-plan-${{ github.run_id }}
          path: terraform/environments
      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="key=prod/eks/terraform.tfstate"
      - name: Apply reviewed plan
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_platform_admin_role_arn: ${{ vars.EKS_ADMIN_ROLE_ARN }}
        run: terraform apply -input=false -lock-timeout=5m prod.tfplan
